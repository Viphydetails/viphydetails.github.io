<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Viphy · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Lobster&display=swap">
<style>
@font-face{font-family:"Agrandir";src:local("Agrandir"),url("fuentes/Agrandir-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Agrandir";src:local("Agrandir Bold"),url("fuentes/Agrandir-Bold.woff2") format("woff2");font-weight:700 800;font-display:swap}
:root{--bg:#fff6f8;--surface:#fff;--ink:#4f000b;--muted:#8a4b57;--line:#f4bfcd;--accent:#4f000b;--accent-ink:#fff;--soft:#ffd6e0;--ok:#117a4d;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b0006;--surface:#3d0711;--ink:#ffe8ee;--muted:#e3b0bd;--line:#6a1c2a;--accent:#ffd6e0;--accent-ink:#4f000b;--soft:#560d1a;--ok:#5fd6a0;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#2b0006;--surface:#3d0711;--ink:#ffe8ee;--muted:#e3b0bd;--line:#6a1c2a;--accent:#ffd6e0;--accent-ink:#4f000b;--soft:#560d1a;--ok:#5fd6a0;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Agrandir,"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;flex-wrap:wrap}
.marca{font-family:Lobster,Georgia,cursive;font-size:1.6rem;color:var(--accent);margin:0}
.marca small{font-family:Agrandir,"Bricolage Grotesque",sans-serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-left:6px;color:var(--muted)}
.acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
h1{font-family:Lobster,Georgia,cursive;font-weight:400;font-size:2rem;margin:6px 0 14px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.peligro{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.chico{padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:wait}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.login{max-width:380px;margin:40px auto}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ayuda{color:var(--muted);font-size:.82rem;margin:4px 0 0}
.msg{margin:12px 0 0;font-weight:600}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.barra{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.item.oculto{opacity:.6}
.mini{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.6rem;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font-size:1rem;line-height:1.25}
.meta{color:var(--muted);font-size:.84rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:700}
.botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vacio{text-align:center;color:var(--muted);padding:30px 10px}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(43,0,6,.55)}
.dlg{padding:20px}
.dlg h2{font-family:Lobster,Georgia,cursive;font-weight:400;font-size:1.6rem;margin:0 0 6px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ft{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:2px solid var(--line)}
.ft:first-child{border-color:var(--accent)}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft .princ{position:absolute;top:4px;left:4px;background:var(--accent);color:var(--accent-ink);font-size:.66rem;font-weight:700;border-radius:999px;padding:1px 7px}
.ft .acc-ft{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;padding:4px;gap:4px;background:linear-gradient(transparent,rgba(43,0,6,.65))}
.ft button{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#4f000b;font-weight:800;cursor:pointer;line-height:1;padding:0}
.ft button[disabled]{opacity:.35;cursor:default}
.mas{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;background:transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:.85rem;display:grid;place-items:center;text-align:center;padding:6px}
.mas:hover{background:var(--soft)}
.tachado{text-decoration:line-through;font-weight:400}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;margin:14px 0 0}
.pie{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
.pie div{display:flex;gap:8px;flex-wrap:wrap}
.oculta{display:none}
@media (max-width:560px){
  .item{grid-template-columns:48px 1fr}
  .mini{width:48px;height:48px}
  .botones{grid-column:1/-1;justify-content:stretch}
  .botones .btn{flex:1}
  .dos{grid-template-columns:1fr}
  .pie,.pie div{flex-direction:column-reverse;width:100%}
  .pie .btn{width:100%}
}
</style>
</head>
<body>
<header>
  <p class="marca">Viphy<small>Admin</small></p>
  <div class="acc"><a class="btn ghost chico" href="index.html" target="_blank" rel="noopener">Ver tienda</a><span id="quien"></span><button class="btn ghost chico oculta" id="salir">Cerrar sesión</button></div>
</header>
<main id="app"><p class="vacio">Cargando…</p></main>

<dialog id="dlg" aria-labelledby="dlgTitulo">
  <form class="dlg" id="form" novalidate>
    <h2 id="dlgTitulo">Producto</h2>
    <label>Fotos</label>
    <div class="galeria" id="galeria"></div>
    <input type="file" id="archivo" accept="image/jpeg,image/png,image/webp,image/*" multiple class="oculta">
    <p class="ayuda">La primera es la principal; usa las flechas para cambiar el orden. Se recortan en cuadrado desde el centro. Máximo 8.</p>
    <label for="nombre">Nombre</label><input type="text" id="nombre" required maxlength="120">
    <label for="descripcion">Descripción</label><textarea id="descripcion" rows="3" maxlength="400"></textarea>
    <label for="categoria">Sección</label><select id="categoria"></select>
    <div class="dos">
      <div><label for="precio">Precio en USD</label><input type="text" id="precio" inputmode="decimal" placeholder="Vacío = por confirmar"></div>
      <div><label for="oferta">Precio en oferta (USD)</label><input type="text" id="oferta" inputmode="decimal" placeholder="Vacío = sin oferta"></div>
    </div>
    <p class="ayuda">Con oferta, la tienda muestra «Antes» con el precio tachado y «Hoy» con el precio en oferta.</p>
    <label class="check"><input type="checkbox" id="visible"> Mostrar en la tienda</label>
    <label class="check"><input type="checkbox" id="nuevo"> Etiqueta NEW</label>
    <p class="msg" id="dlgMsg" role="alert"></p>
    <div class="pie">
      <button type="button" class="btn peligro" id="borrar">Borrar producto</button>
      <div><button type="button" class="btn ghost" id="cancelar">Cancelar</button><button type="submit" class="btn" id="guardar">Guardar</button></div>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="compartido.js"></script>
<script>
const sb = supabase.createClient(SUPABASE.url, SUPABASE.key);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = n => "$" + Number(n).toFixed(2);
const PREFIJO = SUPABASE.url + "/storage/v1/object/public/" + SUPABASE.bucket + "/";
const cat = id => CATS.find(c => c.id === id) || {n:id, e:"🎁"};

const MAX_FOTOS = 8;
// fotos del editor: {url} ya guardada, o {blob, url} nueva (url = vista previa local)
let lista = [], filtro = "todas", actual = null, fotos = [];
const precioTxt = p => p.precio == null ? "Precio por confirmar"
  : p.precio_oferta != null ? `<span class="tachado">${usd(p.precio)}</span> ${usd(p.precio_oferta)}` : usd(p.precio);

/* ===== Sesión ===== */
function vistaLogin(msg){
  $("#salir").classList.add("oculta"); $("#quien").textContent = "";
  $("#app").innerHTML = `<form class="box login" id="login"><h1>Entrar</h1>
  <label for="email">Correo</label><input type="email" id="email" autocomplete="username" required>
  <label for="clave">Contraseña</label><input type="password" id="clave" autocomplete="current-password" required>
  <p class="msg err" id="loginMsg" role="alert">${esc(msg || "")}</p>
  <button class="btn" style="width:100%;margin-top:14px" id="entrar">Entrar</button></form>`;
}
async function entrar(session){
  const email = session.user.email;
  $("#quien").textContent = email; $("#salir").classList.remove("oculta");
  const { data, error } = await sb.from("admins").select("email").maybeSingle();
  if (error){ $("#app").innerHTML = `<p class="vacio">No pude comprobar tu acceso: ${esc(error.message)}</p>`; return; }
  if (!data){ $("#app").innerHTML = `<div class="box login"><h1>Sin permiso</h1><p>La cuenta ${esc(email)} no está en la lista de administradores. Pide que la agreguen en Supabase (tabla <b>admins</b>).</p></div>`; return; }
  await cargar();
}
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "login") return;
  ev.preventDefault();
  const b = $("#entrar"), m = $("#loginMsg");
  b.disabled = true; m.textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#clave").value });
  b.disabled = false;
  if (error){ m.textContent = error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : error.message; return; }
  entrar(data.session);
});
$("#salir").onclick = async () => { await sb.auth.signOut(); vistaLogin(); };

/* ===== Lista ===== */
async function cargar(){
  const { data, error } = await sb.from("productos").select("*").order("orden").order("id");
  if (error){ $("#app").innerHTML = `<p class="vacio">No pude cargar los productos: ${esc(error.message)}</p>`; return; }
  lista = data; pintar();
}
function pintar(){
  const ver = lista.filter(p => filtro === "todas" || p.categoria === filtro);
  const chip = (id, n) => `<button class="chip" data-filtro="${id}" aria-pressed="${filtro === id}">${n}</button>`;
  $("#app").innerHTML = `<div class="barra"><h1 style="margin:0">Productos</h1><button class="btn" data-nuevo="1">+ Nuevo producto</button></div>
  <nav class="chips" aria-label="Filtrar por sección">${chip("todas", "Todas (" + lista.length + ")")}${CATS.map(c => chip(c.id, c.e + " " + c.n + " (" + lista.filter(p => p.categoria === c.id).length + ")")).join("")}</nav>
  <div class="lista">${ver.length ? ver.map(p => `<article class="item${p.visible ? "" : " oculto"}">
    <div class="mini">${p.imagenes.length ? `<img src="${esc(p.imagenes[0])}" alt="" loading="lazy">` : `<span aria-hidden="true">${cat(p.categoria).e}</span>`}</div>
    <div><h3>${esc(p.nombre)}</h3><div class="meta"><span>${esc(cat(p.categoria).n)}</span><span>·</span><b>${precioTxt(p)}</b>${p.imagenes.length > 1 ? `<span>· ${p.imagenes.length} fotos</span>` : ""}${p.precio_oferta != null ? '<span class="tag">Oferta</span>' : ""}${p.nuevo ? '<span class="tag">NEW</span>' : ""}${p.visible ? "" : '<span class="tag">Oculto</span>'}</div></div>
    <div class="botones"><button class="btn ghost chico" data-ver="${p.id}">${p.visible ? "Ocultar" : "Mostrar"}</button><button class="btn chico" data-editar="${p.id}">Editar</button></div>
  </article>`).join("") : `<p class="vacio">No hay productos en esta sección.</p>`}</div>`;
}
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-filtro],[data-nuevo],[data-editar],[data-ver]"); if (!t) return;
  if (t.dataset.filtro){ filtro = t.dataset.filtro; pintar(); }
  else if (t.dataset.nuevo) abrir(null);
  else if (t.dataset.editar) abrir(lista.find(p => p.id == t.dataset.editar));
  else if (t.dataset.ver){
    const p = lista.find(x => x.id == t.dataset.ver); t.disabled = true;
    const { error } = await sb.from("productos").update({ visible: !p.visible }).eq("id", p.id);
    if (error){ alert("No se pudo cambiar: " + error.message); t.disabled = false; return; }
    p.visible = !p.visible; pintar();
  }
});

/* ===== Editor ===== */
$("#categoria").innerHTML = CATS.map(c => `<option value="${c.id}">${c.e} ${esc(c.n)}</option>`).join("");
function pintarFotos(){
  $("#galeria").innerHTML = fotos.map((f, i) => `<div class="ft">${i === 0 ? '<span class="princ">Principal</span>' : ""}<img src="${esc(f.url)}" alt="Foto ${i + 1}">
    <div class="acc-ft"><button type="button" data-mover="${i}:-1" aria-label="Mover a la izquierda" ${i === 0 ? "disabled" : ""}>‹</button>
    <button type="button" data-quitar="${i}" aria-label="Quitar foto">×</button>
    <button type="button" data-mover="${i}:1" aria-label="Mover a la derecha" ${i === fotos.length - 1 ? "disabled" : ""}>›</button></div></div>`).join("")
    + (fotos.length < MAX_FOTOS ? `<button type="button" class="mas" id="masFotos">+ Agregar fotos</button>` : "");
}
function soltarVistas(){ fotos.forEach(f => f.blob && URL.revokeObjectURL(f.url)); }
function abrir(p){
  actual = p; soltarVistas(); fotos = p ? p.imagenes.map(url => ({url})) : [];
  $("#dlgTitulo").textContent = p ? "Editar producto" : "Nuevo producto";
  $("#nombre").value = p ? p.nombre : "";
  $("#descripcion").value = p ? p.descripcion : "";
  $("#categoria").value = p ? p.categoria : (filtro !== "todas" ? filtro : CATS[0].id);
  $("#precio").value = p && p.precio != null ? String(p.precio) : "";
  $("#oferta").value = p && p.precio_oferta != null ? String(p.precio_oferta) : "";
  $("#visible").checked = p ? p.visible : true;
  $("#nuevo").checked = p ? p.nuevo : false;
  $("#borrar").classList.toggle("oculta", !p);
  aviso("");
  pintarFotos(); $("#dlg").showModal();
}
$("#cancelar").onclick = () => $("#dlg").close();
$("#galeria").onclick = ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.id === "masFotos") return $("#archivo").click();
  if (t.dataset.quitar != null){ const [f] = fotos.splice(+t.dataset.quitar, 1); if (f.blob) URL.revokeObjectURL(f.url); }
  else if (t.dataset.mover){ const [i, d] = t.dataset.mover.split(":").map(Number); [fotos[i], fotos[i + d]] = [fotos[i + d], fotos[i]]; }
  pintarFotos();
};
$("#archivo").onchange = async ev => {
  const files = [...ev.target.files]; ev.target.value = "";
  const libres = MAX_FOTOS - fotos.length;
  let malas = 0;
  for (const file of files.slice(0, libres)){
    try { const blob = await cuadrar(file); fotos.push({blob, url: URL.createObjectURL(blob)}); }
    catch (e){ malas++; }
  }
  pintarFotos();
  const avisos = [];
  if (malas) avisos.push(malas === 1 ? "No pude abrir una de las imágenes; prueba con JPG o PNG." : `No pude abrir ${malas} imágenes; prueba con JPG o PNG.`);
  if (files.length > libres) avisos.push(`Solo se permiten ${MAX_FOTOS} fotos por producto.`);
  aviso(avisos.join(" "), avisos.length > 0);
};
const numero = txt => { const t = txt.trim().replace(/\s|\$/g, "").replace(",", "."); return t === "" ? null : Number(t); };
// Recorta al centro en cuadrado y la reduce a 800 px como máximo.
async function cuadrar(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const lado = Math.min(img.naturalWidth, img.naturalHeight), T = Math.min(800, lado);
    const c = document.createElement("canvas"); c.width = c.height = T;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, T, T);
    ctx.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, T, T);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    if (!blob) throw new Error("sin imagen");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
function aviso(txt, error){ const m = $("#dlgMsg"); m.textContent = txt; m.className = "msg" + (txt ? (error ? " err" : " ok") : ""); }
// Borra del almacenamiento las fotos subidas desde el panel (las de imagenes/ quedan en la web).
async function borrarArchivos(urls){
  const rutas = urls.filter(u => u && u.startsWith(PREFIJO)).map(u => decodeURIComponent(u.slice(PREFIJO.length)));
  if (rutas.length) await sb.storage.from(SUPABASE.bucket).remove(rutas);
}

$("#form").onsubmit = async ev => {
  ev.preventDefault();
  const nombre = $("#nombre").value.trim();
  const precio = numero($("#precio").value), oferta = numero($("#oferta").value);
  if (!nombre) return aviso("Escribe el nombre del producto.", true);
  if (precio !== null && !(precio >= 0)) return aviso("El precio debe ser un número, por ejemplo 25 o 25.50.", true);
  if (oferta !== null && !(oferta >= 0)) return aviso("El precio en oferta debe ser un número, por ejemplo 20 o 19.99.", true);
  if (oferta !== null && precio === null) return aviso("Para poner una oferta, escribe primero el precio normal.", true);
  if (oferta !== null && oferta >= precio) return aviso("El precio en oferta debe ser menor que el precio normal.", true);
  const b = $("#guardar"); b.disabled = true; aviso("Guardando…");
  const subidas = [];
  try {
    const imagenes = [];
    for (const f of fotos){
      if (!f.blob){ imagenes.push(f.url); continue; }
      aviso(`Subiendo fotos… (${subidas.length + 1} de ${fotos.filter(x => x.blob).length})`);
      const ruta = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
      const { error } = await sb.storage.from(SUPABASE.bucket).upload(ruta, f.blob, { contentType: "image/jpeg", cacheControl: "31536000" });
      if (error) throw error;
      const url = sb.storage.from(SUPABASE.bucket).getPublicUrl(ruta).data.publicUrl;
      subidas.push(url); imagenes.push(url);
    }
    aviso("Guardando…");
    const fila = { nombre, descripcion: $("#descripcion").value.trim(), categoria: $("#categoria").value, precio, precio_oferta: oferta, imagenes, visible: $("#visible").checked, nuevo: $("#nuevo").checked };
    let res;
    if (actual) res = await sb.from("productos").update(fila).eq("id", actual.id).select().single();
    else {
      fila.orden = Math.max(0, ...lista.map(p => p.orden)) + 10;
      res = await sb.from("productos").insert(fila).select().single();
    }
    if (res.error) throw res.error;
    if (actual) await borrarArchivos(actual.imagenes.filter(u => !imagenes.includes(u)));
    soltarVistas(); fotos = imagenes.map(url => ({url}));
    if (actual) Object.assign(actual, res.data); else lista.push(res.data);
    $("#dlg").close(); pintar();
  } catch (e){
    await borrarArchivos(subidas).catch(() => {});
    aviso("No se pudo guardar: " + e.message, true);
  }
  finally { b.disabled = false; }
};
$("#borrar").onclick = async () => {
  if (!actual || !confirm("¿Borrar «" + actual.nombre + "»? Esto no se puede deshacer. Si solo quieres quitarlo un tiempo, usa «Ocultar».")) return;
  const { error } = await sb.from("productos").delete().eq("id", actual.id);
  if (error) return aviso("No se pudo borrar: " + error.message, true);
  await borrarArchivos(actual.imagenes);
  lista = lista.filter(p => p !== actual); $("#dlg").close(); pintar();
};

/* ===== Inicio ===== */
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") vistaLogin(); });
sb.auth.getSession().then(({ data }) => data.session ? entrar(data.session) : vistaLogin());
