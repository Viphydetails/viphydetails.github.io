name: Actualizar tasa euro BCV
on:
  schedule:
    - cron: "0 11 * * *"   # 7:00 a. m. Caracas
    - cron: "0 22 * * *"   # 6:00 p. m. Caracas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tasa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-tasa.mjs
      - run: |
          git config user.name "tasa-bot"
          git config user.email "tasa-bot@users.noreply.github.com"
          git add tasa.json
          git diff --cached --quiet || (git commit -m "Actualizar tasa euro" && git push)
